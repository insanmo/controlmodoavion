name: Diagnose personnel focal relation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Inspect relation without modifying data
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_TEMP_PASSWORD: ${{ secrets.ADMIN_TEMP_PASSWORD }}
        run: python .github/scripts/diagnose_focal.py
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-function-source
          path: diagnostic-source/
          retention-days: 1
          if-no-files-found: ignore
