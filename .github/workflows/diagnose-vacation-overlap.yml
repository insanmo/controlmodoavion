name: Diagnose vacation overlap
on:
  workflow_dispatch:
    inputs:
      collaborator_key:
        description: SHA256 of normalized collaborator name
        required: true
        type: string
      start_date:
        required: true
        type: string
      end_date:
        required: true
        type: string
      visible_month:
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Inspect overlap counts without modifying data
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          COLLABORATOR_KEY: ${{ inputs.collaborator_key }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          VISIBLE_MONTH: ${{ inputs.visible_month }}
        run: python .github/scripts/diagnose_vacation_overlap.py
