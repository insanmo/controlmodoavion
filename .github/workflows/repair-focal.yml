name: Repair personnel focal assignment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repair-personnel-focal
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Apply and verify focal repair in one transaction
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python .github/scripts/repair_focal.py
